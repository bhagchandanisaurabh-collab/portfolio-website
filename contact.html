<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Your Name</title>
    <meta
      name="description"
      content="Contact Your Name for projects, collaborations, and opportunities."
    >
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/site-components.js" defer></script>
  </head>
  <body>
    <site-header></site-header>
    <page-banner page="Contact"></page-banner>

    <main id="main-content" class="container page contact-page">
      <section class="contact-section" aria-labelledby="contact-title">
        <div class="contact-section-content">
          <header class="contact-intro">
            <h1 id="contact-title">Contact Me</h1>
            <p id="contact-description">I&rsquo;d love to hear about your project, idea, or opportunity.</p>
          </header>

          <form
            class="contact-form"
            name="contact"
            method="POST"
            data-netlify="true"
            data-netlify-honeypot="bot-field"
            aria-describedby="contact-description"
          >
            <input type="hidden" name="form-name" value="contact">
            <p hidden>
              <label for="contact-bot-field">Leave this field empty</label>
              <input id="contact-bot-field" name="bot-field" type="text" autocomplete="off" tabindex="-1">
            </p>

            <div class="contact-field">
              <label class="contact-label" for="contact-name">Your Name</label>
              <input
                id="contact-name"
                name="name"
                type="text"
                autocomplete="name"
                placeholder="Your Name"
                required
              >
            </div>

            <div class="contact-field">
              <label class="contact-label" for="contact-email">Email Address</label>
              <input
                id="contact-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="Email Address"
                required
              >
            </div>

            <div class="contact-field contact-field--phone">
              <label class="contact-label" for="contact-phone">Phone (Optional)</label>
              <input
                id="contact-phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                placeholder="Phone (Optional)"
              >
            </div>

            <div class="contact-field contact-field--message">
              <label class="contact-label" for="contact-message">Your Message</label>
              <textarea
                id="contact-message"
                name="message"
                rows="7"
                placeholder="Your Message"
                required
              ></textarea>
            </div>

            <button class="button primary contact-submit" type="submit">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <site-footer></site-footer>
  </body>
</html>
